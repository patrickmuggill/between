name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - run: npm run build
      # Refresh stable Chrome on the ephemeral runner, then verify before launch.
      - run: npx --no-install playwright install --with-deps --force chrome
      - run: node scripts/verified-browser.mjs
      - run: npm run test:browser
        env:
          CI: "true"
      - name: Keep synthetic browser screenshots for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-screenshots
          path: output/playwright/*.png
          if-no-files-found: ignore
          retention-days: 7
